<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLC Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .h-15 { height: 3.75rem; }
        .bg-selected { background-color: #e0e7ff; }
    </style>
</head>
<body class="bg-gray-100 h-screen w-screen flex flex-col overflow-hidden">
    <!-- Top Bar -->
    <header class="bg-white shadow p-2 flex items-center gap-4 border-b border-gray-300">
        <div class="flex items-center gap-2">
            <span class="font-bold text-gray-700">PLC Simulator</span>
        </div>
        <div class="h-6 w-px bg-gray-300"></div>
        <button id="start-btn" class="flex items-center gap-1 px-3 py-1 bg-green-100 hover:bg-green-200 text-green-700 rounded transition">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" /></svg>
            Start
        </button>
        <button id="stop-btn" class="hidden flex items-center gap-1 px-3 py-1 bg-red-100 hover:bg-red-200 text-red-700 rounded transition">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd" /></svg>
            Stop
        </button>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- Main Logic View -->
        <main class="flex-1 flex flex-col bg-gray-50 overflow-hidden">
            <div class="bg-white border-b border-gray-200 px-4 py-2 flex gap-4 text-sm text-gray-600">
                <button class="font-bold text-blue-600 border-b-2 border-blue-600 pb-2 -mb-2.5">Logic</button>
                <button class="hover:text-gray-900">Tags</button>
            </div>

            <div id="ladder-container" class="flex-1 overflow-auto p-4">
                <!-- Ladder HTML injected here -->
                <div class="text-gray-400 text-center mt-10">Loading Logic...</div>
            </div>
        </main>

        <!-- Sidebar -->
        <aside class="w-80 bg-white border-l border-gray-200 flex flex-col">
            <div class="p-4 border-b border-gray-200">
                <h2 class="text-xs font-mono uppercase text-gray-500 mb-2">Simulation Status</h2>
                <div class="flex items-center gap-2">
                    <div id="status-dot" class="w-2 h-2 rounded-full bg-red-500"></div>
                    <span id="status-text" class="font-bold text-red-500 text-sm">STOPPED</span>
                </div>
                <div class="mt-2 text-xs text-gray-400">Cycle: <span id="cycle-count">0</span></div>
            </div>

            <div class="flex-1 flex flex-col overflow-hidden">
                <div class="flex text-xs font-medium text-gray-500 border-b border-gray-200">
                    <button class="flex-1 py-2 text-blue-600 border-b-2 border-blue-600">All</button>
                    <button class="flex-1 py-2 hover:bg-gray-50">Inputs</button>
                    <button class="flex-1 py-2 hover:bg-gray-50">Outputs</button>
                </div>

                <div id="tags-list" class="flex-1 overflow-auto p-4 space-y-3">
                    <!-- Tags generated by JS -->
                </div>
            </div>
        </aside>
    </div>

    <script src="client.js"></script>
</body>
</html>
